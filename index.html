<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH ARSENAL</title>
    <link rel="stylesheet" href="arsenal-pages.css">
    <style>
        /* ===== Hero Stats Ledger ===== */
        .hero-stats-inline {
            display: inline-flex;
            align-items: stretch;
            gap: 0;
            margin-bottom: 32px;
            padding: 16px 20px;
            background: var(--panel-solid, #131a26);
            border: 1px solid var(--line-strong, rgba(160, 176, 204, 0.28));
            border-radius: 6px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 24px -4px rgba(0, 0, 0, 0.35);
        }

        .hero-stat-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 22px;
        }

        .hero-stat-item:first-child {
            padding-left: 2px;
        }

        .hero-stat-item:last-child {
            padding-right: 2px;
        }

        .hero-stat-item + .hero-stat-item {
            border-left: 1px solid var(--line, rgba(160, 176, 204, 0.14));
        }

        .hero-stat-item strong {
            font-size: 2.1rem;
            letter-spacing: -0.02em;
            font-family: var(--display);
            color: var(--text);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .hero-stat-item.owned strong {
            color: var(--accent-2, #91a5ff);
        }

        .hero-stat-label {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-family: var(--mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-2);
            line-height: 1.2;
        }

        /* ===== Minimalist Hero Bento ===== */
        .home-hero-card {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.75fr);
            background: var(--panel-solid, #131a26);
            border: 1px solid var(--line-strong, rgba(160, 176, 204, 0.28));
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 48px;
        }

        .home-hero-content {
            padding: 36px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
        }

        .home-hero-preview {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 36px;
            background: rgba(255, 255, 255, 0.012);
            border-left: 1px solid var(--line, rgba(160, 176, 204, 0.14));
        }

        .home-hero-preview img {
            max-width: 82%;
            max-height: 240px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45));
            user-select: none;
            pointer-events: none;
        }

        .home-preview-badge {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-family: var(--mono, monospace);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: var(--muted-2, #7f8ca2);
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .home-hero-card {
                grid-template-columns: 1fr;
            }
            .home-hero-preview {
                border-left: 0;
                border-top: 1px solid var(--line, rgba(160, 176, 204, 0.14));
                padding: 28px;
            }
            .home-hero-content {
                padding: 24px 20px;
            }
            .hero-stats-inline {
                padding: 12px 14px;
                margin-bottom: 20px;
                width: 100%;
                justify-content: space-between;
            }
            .hero-stat-item {
                padding: 0 10px;
            }
            .hero-stat-item strong {
                font-size: 1.5rem;
            }
            .hero-stat-label .lang-zh {
                font-size: 0.68rem;
            }
            .hero-stat-label .lang-en {
                font-size: 0.52rem;
            }
        }
    </style>
</head>
<body class="catalogue-page">
    <header class="header site-header">
        <div class="header-top top-row">
            <a class="back-link home-mark-link" href="index.html" aria-label="Back to home" title="Back to home">
                <img src="assets/images/arsenal-spark.png" alt="Tech Arsenal spark mark" width="1000" height="1000" loading="eager" decoding="async">
            </a>
            <nav class="page-nav" aria-label="Site navigation">
                <a class="page-link active" href="index.html" aria-current="page">Home</a>
                <a class="page-link" href="tech-arsenal.html">Catalogue</a>
                <a class="page-link" href="comparison-lab.html">Compare</a>
                <a class="page-link" href="topology.html">Setup</a>
            </nav>
        </div>

        <div class="masthead">
            <div class="masthead-copy">
                <h1 class="main-title"><span class="tech">TECH</span> <span class="arsenal">ARSENAL</span></h1>
            </div>
        </div>
    </header>

    <main class="collection">
        <section class="home-hero-card">
            <div class="home-hero-content">
                <div class="hero-stats-inline" aria-label="Collection statistics">
                    <div class="hero-stat-item">
                        <strong class="stat-num">060</strong>
                        <span class="hero-stat-label">catalogued</span>
                    </div>
                    <div class="hero-stat-item owned">
                        <strong class="stat-num">005</strong>
                        <span class="hero-stat-label">in collection</span>
                    </div>
                    <div class="hero-stat-item">
                        <strong class="stat-num">055</strong>
                        <span class="hero-stat-label">pursuing</span>
                    </div>
                </div>
                <div class="hero-actions">
                    <a class="button-primary" href="tech-arsenal.html">Open Catalogue</a>
                    <a class="button-secondary" href="comparison-lab.html">Open Comparison Lab</a>
                </div>
            </div>

            <div class="home-hero-preview">
                <img src="assets/images/macstudio-m4-ultra-transparent.png" alt="Mac Studio M4 Ultra" width="1254" height="1254" loading="eager" decoding="async">
                <span class="home-preview-badge">FLAGSHIP · MAC STUDIO</span>
            </div>
        </section>

        <section class="section" id="sec-creator">
            <div class="chapter-head">
                <span class="chapter-eyebrow">REFERENCE</span>
                <h2 class="section-title">Selected Reviews · BOJIO</h2>
                <div class="chapter-rule"></div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/T4FwjYAWAwI?si=FUs0qRRfZWWGJGwA&amp;start=568" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h4 class="video-title">BOJIO - Selected Technology Reviews</h4>
                    <span class="video-tagpill">DEEP DIVE</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-line">TECH ARSENAL / HOME</div>
    </footer>
    <script src="arsenal-site.js"></script>
</body>
</html>
